<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORIGIN | 외부 원고 이어쓰기</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="index.html"><span class="brand-mark">O</span>RIGIN</a><p>외부 원고를 이어 쓰세요</p><a class="archive-home" href="archive.html">이야기 보관함</a></header><main class="import-page"><div class="eyebrow">CONTINUE AN EXISTING STORY</div><h1>외부 원고 이어쓰기</h1><p class="archive-page-note">다른 곳에서 작성한 이야기를 붙여 넣으면, 그 원고 다음부터 새 이야기를 이어서 만들 수 있습니다.</p><section class="import-card"><form id="import-form"><div class="split"><div class="field"><label for="import-title">이야기 제목 <span>필수</span></label><input id="import-title" required maxlength="120" placeholder="예: 용의 아이"></div><div class="field"><label for="import-genre">형식 / 장르</label><select id="import-genre"><option>소설 · 판타지</option><option>드라마 · 로맨스</option><option>영화 · 스릴러</option><option>애니 · 모험</option><option>SF</option><option>미스터리</option></select></div></div><div class="field"><label for="import-setting">이야기 설정 <span>선택</span></label><textarea id="import-setting" placeholder="세계관, 인물 관계, 앞으로 원하는 방향을 적어 주세요."></textarea></div><div class="field"><label for="import-character">오리지널 캐릭터 <span>선택</span></label><textarea id="import-character" placeholder="직접 만든 캐릭터가 있으면 입력하세요."></textarea></div><div class="field"><label for="import-story">이어갈 기존 이야기 <span>필수</span></label><textarea id="import-story" class="import-story" required placeholder="다른 곳에서 작성한 원고를 붙여 넣으세요."></textarea><small id="import-count">공백 제외 0자 · 최대 20,050자까지 다음 화의 문맥으로 사용합니다.</small></div><button class="generate" type="submit"><span>✦</span> 이 원고로 다음 이야기 만들기</button></form></section></main><footer>ORIGIN STORY MAKER <span>·</span> YOUR IDEA, YOUR WORLD</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script><script src="import.js"></script></body></html>
